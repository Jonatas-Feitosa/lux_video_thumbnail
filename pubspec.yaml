name: lux_video_thumbnail
description: Generate video thumbnails at a timestamp on Android, iOS and web, with a video picker, timeline slider, and image preview widget.
version: 0.0.2-ios.1
repository: https://github.com/Jonatas-Feitosa/lux_video_thumbnail

topics:
  - video
  - thumbnail
  - video-thumbnail
  - video-picker
  - flutter-web

environment:
  sdk: ^3.10.9
  flutter: '>=3.38.10'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  lux_video_thumbnail_platform_interface: ^1.0.0
  lux_video_thumbnail_web: ^1.0.0
  lux_video_thumbnail_android: ^1.0.0
  lux_video_thumbnail_ios: ^1.0.0-dev.1
  plugin_platform_interface: ^2.1.8
  web: ^1.1.1
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: lux_video_thumbnail_android
      ios:
        default_package: lux_video_thumbnail_ios
      web:
        default_package: lux_video_thumbnail_web
